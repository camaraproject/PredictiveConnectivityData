    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: wip
  x-camara-commonalities: 0.9.0
externalDocs:
  description: Product documentation at CAMARA
  url: https://github.com/camaraproject/PredictiveConnectivityData
servers:
  - url: "{apiRoot}/predictive-connectivity-data-subscriptions/vwip"
    variables:
      apiRoot:
        default: http://localhost:9091
        description: API root, defined by the service provider, e.g. `api.example.com` or `api.example.com/somepath`
tags:
  - name: Predictive Connectivity Data Subscriptions
    description: Create, retrieve and delete route connectivity-change subscriptions.

paths:
  /subscriptions:
    post:
      tags:
        - Predictive Connectivity Data Subscriptions
      summary: Create a route connectivity-change subscription
      description: Create a subscription to connectivity-change events for a planned route.
      operationId: createPredictiveConnectivityDataSubscription
      parameters:
        - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
      security:
        - openId:
            - predictive-connectivity-data-subscriptions:org.camaraproject.predictive-connectivity-data-subscriptions.v0.connectivity-degraded:create
            - predictive-connectivity-data-subscriptions:org.camaraproject.predictive-connectivity-data-subscriptions.v0.connectivity-improved:create
            - predictive-connectivity-data-subscriptions:org.camaraproject.predictive-connectivity-data-subscriptions.v0.prediction-expired:create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionRequest"
            examples:
              SubscriptionRequestExample:
                $ref: "#/components/examples/SubscriptionRequestExample"
        required: true
      callbacks:
        notifications:
          "{$request.body#/sink}":
            post:
              summary: notifications callback
              description: |
                Important: this endpoint is to be implemented by the API consumer.
                The server calls this endpoint whenever a connectivity-change or
                subscription lifecycle event occurs.
              operationId: postNotification
              parameters:
                - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
              requestBody:
                required: true
                content:
                  application/cloudevents+json:
                    schema:
                      $ref: "#/components/schemas/NotificationEvent"
              responses:
                "204":
                  description: Successful notification
                  headers:
                    x-correlator:
                      $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
                "400":
                  $ref: "../common/CAMARA_common.yaml#/components/responses/BadRequest400"
                "401":
                  $ref: "../common/CAMARA_common.yaml#/components/responses/Unauthenticated401"
                "403":
                  $ref: "../common/CAMARA_common.yaml#/components/responses/PermissionDenied403"
                "410":
                  $ref: "../common/CAMARA_event_common.yaml#/components/responses/SinkGone410"
                "429":
                  $ref: "../common/CAMARA_common.yaml#/components/responses/TooManyRequests429"
              security:
                - {}
                - notificationsBearerAuth: []
      responses:
        "201":
          description: Created
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "202":
          description: Request accepted to be processed. It applies for async creation process.
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionAsync"
        "400":
          $ref: "../common/CAMARA_event_common.yaml#/components/responses/CreateSubscriptionBadRequest400"
        "401":
          $ref: "../common/CAMARA_common.yaml#/components/responses/Unauthenticated401"
        "403":
          $ref: "../common/CAMARA_event_common.yaml#/components/responses/SubscriptionPermissionDenied403"
        "409":
          $ref: "../common/CAMARA_event_common.yaml#/components/responses/CreateSubscriptionConflict409"
        "422":
          $ref: "#/components/responses/CreateSubscriptionUnprocessableContent422"
        "429":
          $ref: "../common/CAMARA_common.yaml#/components/responses/TooManyRequests429"
    get:
      tags:
        - Predictive Connectivity Data Subscriptions
      summary: Retrieve a list of route connectivity-change subscriptions
      description: Retrieve the connectivity-change subscriptions owned by the caller.
      operationId: listPredictiveConnectivityDataSubscriptions
      parameters:
        - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
        - $ref: "../common/CAMARA_common.yaml#/components/parameters/page"
        - $ref: "../common/CAMARA_common.yaml#/components/parameters/perPage"
      security:
        - openId:
            - predictive-connectivity-data-subscriptions:read
      responses:
        "200":
          description: List of event subscription details
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
            X-Total-Count:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-total-count"
            X-Total-Pages:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-total-pages"
            Link:
              $ref: "../common/CAMARA_common.yaml#/components/headers/link"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionList"
        "400":
          $ref: "../common/CAMARA_common.yaml#/components/responses/BadRequest400"
        "401":
          $ref: "../common/CAMARA_common.yaml#/components/responses/Unauthenticated401"
        "403":
          $ref: "../common/CAMARA_common.yaml#/components/responses/PermissionDenied403"
  /subscriptions/{subscriptionId}:
    get:
      tags:
        - Predictive Connectivity Data Subscriptions
      summary: Retrieve a route connectivity-change subscription
      description: Retrieve a connectivity-change subscription by its identifier.
      operationId: retrievePredictiveConnectivityDataSubscription
      security:
        - openId:
            - predictive-connectivity-data-subscriptions:read
      parameters:
        - $ref: "#/components/parameters/SubscriptionId"
        - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
      responses:
        "200":
          description: OK
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "400":
          $ref: "../common/CAMARA_event_common.yaml#/components/responses/SubscriptionIdRequired400"
        "401":
          $ref: "../common/CAMARA_common.yaml#/components/responses/Unauthenticated401"
        "403":
          $ref: "../common/CAMARA_common.yaml#/components/responses/PermissionDenied403"
        "404":
          $ref: "../common/CAMARA_common.yaml#/components/responses/NotFound404"
    delete:
      tags:
        - Predictive Connectivity Data Subscriptions
      summary: Delete a route connectivity-change subscription
      operationId: deletePredictiveConnectivityDataSubscription
      description: Cancel a connectivity-change subscription and stop further notifications.
      security:
        - openId:
            - predictive-connectivity-data-subscriptions:delete
      parameters:
        - $ref: "#/components/parameters/SubscriptionId"
        - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
      responses:
        "204":
          description: Subscription deleted
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
        "202":
          description: Request accepted to be processed. It applies for async deletion process.
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionAsync"
        "400":
          $ref: "../common/CAMARA_event_common.yaml#/components/responses/SubscriptionIdRequired400"
        "401":
          $ref: "../common/CAMARA_common.yaml#/components/responses/Unauthenticated401"
        "403":
          $ref: "../common/CAMARA_common.yaml#/components/responses/PermissionDenied403"
        "404":
          $ref: "../common/CAMARA_common.yaml#/components/responses/NotFound404"

components:
  securitySchemes:
    openId:
      $ref: "../common/CAMARA_common.yaml#/components/securitySchemes/openId"
    notificationsBearerAuth:
      $ref: "../common/CAMARA_event_common.yaml#/components/securitySchemes/notificationsBearerAuth"

  parameters:
    SubscriptionId:
      name: subscriptionId
      in: path
      description: Subscription identifier that was obtained from the create subscription operation
      required: true
      schema:
        $ref: "../common/CAMARA_event_common.yaml#/components/schemas/SubscriptionId"

  responses:
    # 422 for this subscription API specifically: the subject is a route, not a
    # device or phone number, so neither CreateSubscriptionDevice422 nor
    # CreateSubscriptionPhoneNumber422 applies. Only the identifier-independent
    # codes from that family are reused here; do not add MISSING_IDENTIFIER /
    # UNSUPPORTED_IDENTIFIER / UNNECESSARY_IDENTIFIER, this API has no identifier.
    CreateSubscriptionUnprocessableContent422:
      description: Unprocessable Content
      headers:
        x-correlator:
          $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "../common/CAMARA_common.yaml#/components/schemas/ErrorInfo"
              - type: object
                properties:
                  status:
                    enum:
                      - 422
                  code:
                    enum:
                      - SERVICE_NOT_APPLICABLE
                      - MULTIEVENT_SUBSCRIPTION_NOT_SUPPORTED
                      - MULTIEVENT_COMBINATION_TEMPORARILY_NOT_SUPPORTED
                      - PRIVATE_KEY_JWT_NOT_CONFIGURED
          examples:
            GENERIC_422_SERVICE_NOT_APPLICABLE:
              $ref: "../common/CAMARA_common.yaml#/components/examples/GENERIC_422_SERVICE_NOT_APPLICABLE"
            GENERIC_422_MULTIEVENT_SUBSCRIPTION_NOT_SUPPORTED:
              $ref: "../common/CAMARA_event_common.yaml#/components/examples/GENERIC_422_MULTIEVENT_SUBSCRIPTION_NOT_SUPPORTED"
            GENERIC_422_MULTIEVENT_COMBINATION_TEMPORARILY_NOT_SUPPORTED:
              $ref: "../common/CAMARA_event_common.yaml#/components/examples/GENERIC_422_MULTIEVENT_COMBINATION_TEMPORARILY_NOT_SUPPORTED"
            GENERIC_422_PRIVATE_KEY_JWT_NOT_CONFIGURED:
              $ref: "../common/CAMARA_event_common.yaml#/components/examples/GENERIC_422_PRIVATE_KEY_JWT_NOT_CONFIGURED"

  schemas:
    SubscriptionRequest:
      description: The request for creating a route connectivity-change event subscription.
      type: object
      required:
        - sink
        - protocol
        - config
        - types
      properties:
        protocol:
          $ref: "../common/CAMARA_event_common.yaml#/components/schemas/Protocol"
        sink:
          description: The address to which events shall be delivered using the selected protocol.
          allOf:
            - $ref: "../common/CAMARA_event_common.yaml#/components/schemas/Sink"
        sinkCredential:
          $ref: "../common/CAMARA_event_common.yaml#/components/schemas/SinkCredential"
        types:
          description: |
            Event types eligible to be delivered by this subscription. A subscriber
            may request one or more of the three event types in a single subscription.
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: "#/components/schemas/ApiEventType"
        config:
          $ref: "#/components/schemas/Config"
      discriminator:
        propertyName: protocol
        mapping:
          HTTP: "#/components/schemas/HTTPSubscriptionRequest"

    Subscription:
      description: Represents a route connectivity-change subscription.
      type: object
      required:
        - sink
        - protocol
        - config
        - types
        - id
      properties:
        protocol:
          $ref: "../common/CAMARA_event_common.yaml#/components/schemas/Protocol"
        sink:
          description: The address to which events shall be delivered using the selected protocol.
          allOf:
            - $ref: "../common/CAMARA_event_common.yaml#/components/schemas/Sink"
        sinkCredential:
          $ref: "../common/CAMARA_event_common.yaml#/components/schemas/SinkCredential"
        types:
          description: Event types eligible to be delivered by this subscription.
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: "#/components/schemas/ApiEventType"
        config:
          $ref: "#/components/schemas/Config"
        id:
          $ref: "../common/CAMARA_event_common.yaml#/components/schemas/SubscriptionId"
        startsAt:
          $ref: "../common/CAMARA_common.yaml#/components/schemas/DateTime"
        expiresAt:
          $ref: "../common/CAMARA_common.yaml#/components/schemas/DateTime"
        status:
          type: string
          description: |-
            Current status of the subscription. Details:
              - `ACTIVATION_REQUESTED`: Subscription creation (POST) is triggered but subscription creation process is not finished yet.
              - `ACTIVE`: Subscription creation process is completed. Subscription is fully operative.
              - `INACTIVE`: Subscription is temporarily inactive, but its workflow logic is not deleted.
              - `EXPIRED`: Subscription is ended (no longer active) because it reached its expiry time or event count.
              - `DELETED`: Subscription is ended as deleted (no longer active).
          enum:
            - ACTIVATION_REQUESTED
            - ACTIVE
            - EXPIRED
            - INACTIVE
            - DELETED
      discriminator:
        propertyName: protocol
        mapping:
          HTTP: "#/components/schemas/HTTPSubscriptionResponse"

    SubscriptionAsync:
      description: Response for a subscription request managed asynchronously (creation or deletion).
      type: object
      required:
        - id
      properties:
        id:
          $ref: "../common/CAMARA_event_common.yaml#/components/schemas/SubscriptionId"

    SubscriptionList:
      description: Response with subscriptions list.
      type: object
      required:
        - subscriptions
        - pagination
      properties:
        subscriptions:
          description: Subscriptions list.
          type: array
          minItems: 0
          maxItems: 100
          items:
            $ref: "#/components/schemas/Subscription"
        pagination:
          $ref: "../common/CAMARA_common.yaml#/components/schemas/Pagination"

    Config:
      description: |
        Implementation-specific configuration parameters needed by the
        subscription manager for acquiring events. Extends `ConfigBase` from
        `CAMARA_event_common.yaml` with the required `subscriptionDetail`
        property and the optional `initialEvent` property.
      allOf:
        - $ref: "../common/CAMARA_event_common.yaml#/components/schemas/ConfigBase"
        - type: object
          required:
            - subscriptionDetail
          properties:
            subscriptionDetail:
              $ref: "#/components/schemas/SubscriptionDetail"
            initialEvent:
              type: boolean
              description: If `true`, an initial event is sent reflecting the current prediction as soon as the subscription is created.

    SubscriptionDetail:
      description: |
        Filtering scope for the subscription. Route-based scoping is mandatory
        via `route` and `serviceLevel`; segment and area scoping are optional
        refinements. `segmentIds` is the primary anti-spam mechanism for long
        routes: without it, a subscriber receives events for every segment.
        `area` and `segmentIds` MUST NOT both be set, since how they combine
        is not yet defined; a request setting both is rejected with
        `400 INVALID_ARGUMENT`.
      type: object
      required:
        - route
        - serviceLevel
      not:
        required:
          - area
          - segmentIds
      properties:
        route:
          type: array
          minItems: 2
          maxItems: 50
          description: Ordered waypoints describing the route, the same shape as `area.waypoints` on the base retrieve request.
          items:
            $ref: "../common/CAMARA_common.yaml#/components/schemas/Point"
        serviceLevel:
          $ref: "predictive-connectivity-data.yaml#/components/schemas/ServiceLevel"
        networkType:
          $ref: "predictive-connectivity-data.yaml#/components/schemas/NetworkType"
        height:
          type: integer
          format: int32
          minimum: 0
          maximum: 250
          description: Same meaning as `height` on the base retrieve request.
        segmentIds:
          type: array
          description: Optional subset of segment identifiers to receive events for.
          maxItems: 50
          items:
            type: string
            maxLength: 16
            description: Identifier of a route segment, in the same `seg-{startWaypointIndex}-{endWaypointIndex}` form returned by the base retrieve operation.
        area:
          $ref: "../common/CAMARA_common.yaml#/components/schemas/Circle"

    ApiEventType:
      type: string
      description: |
        Enum of Predictive Connectivity Data Subscriptions event type strings. The
        reverse-DNS prefix `org.camaraproject.predictive-connectivity-data-subscriptions`
        makes each value globally unique.
      enum:
        - org.camaraproject.predictive-connectivity-data-subscriptions.v0.connectivity-degraded
        - org.camaraproject.predictive-connectivity-data-subscriptions.v0.connectivity-improved
        - org.camaraproject.predictive-connectivity-data-subscriptions.v0.prediction-expired

    SubscriptionLifecycleEvent:
      description: |
        Subscription lifecycle event group, common to all CAMARA APIs that
        support explicit subscriptions. Extends the CloudEvents envelope and
        constrains `type` to the set of lifecycle event types managed by
        Commonalities.
      allOf:
        - $ref: "../common/CAMARA_event_common.yaml#/components/schemas/CloudEvent"
        - type: object
          properties:
            type:
              $ref: "#/components/schemas/SubscriptionLifecycleEventType"
      discriminator:
        propertyName: type
        mapping:
          org.camaraproject.predictive-connectivity-data-subscriptions.v0.subscription-started: "#/components/schemas/EventSubscriptionStarted"
          org.camaraproject.predictive-connectivity-data-subscriptions.v0.subscription-updated: "#/components/schemas/EventSubscriptionUpdated"
          org.camaraproject.predictive-connectivity-data-subscriptions.v0.subscription-ended: "#/components/schemas/EventSubscriptionEnded"

    SubscriptionLifecycleEventType:
      type: string
      description: Enum of subscription lifecycle event type strings, managed by Commonalities.
      enum:
        - org.camaraproject.predictive-connectivity-data-subscriptions.v0.subscription-started
        - org.camaraproject.predictive-connectivity-data-subscriptions.v0.subscription-updated
        - org.camaraproject.predictive-connectivity-data-subscriptions.v0.subscription-ended

    ApiNotificationEvent:
      description: |
        Predictive Connectivity Data Subscriptions notification event group.
        Extends the CloudEvents envelope and constrains `type` to this API's
        own event types.
      allOf:
        - $ref: "../common/CAMARA_event_common.yaml#/components/schemas/CloudEvent"
        - type: object
          properties:
            type:
              $ref: "#/components/schemas/ApiEventType"
      discriminator:
        propertyName: "type"
        mapping:
          org.camaraproject.predictive-connectivity-data-subscriptions.v0.connectivity-degraded: "#/components/schemas/EventConnectivityDegraded"
          org.camaraproject.predictive-connectivity-data-subscriptions.v0.connectivity-improved: "#/components/schemas/EventConnectivityImproved"
          org.camaraproject.predictive-connectivity-data-subscriptions.v0.prediction-expired: "#/components/schemas/EventPredictionExpired"

    NotificationEvent:
      description: Union of all valid notification event groups at the callback endpoint.
      oneOf:
        - $ref: "#/components/schemas/ApiNotificationEvent"
        - $ref: "#/components/schemas/SubscriptionLifecycleEvent"

    EventConnectivityDegraded:
      description: The predicted connectivity for a subscribed segment and layer moved to a worse category.
      allOf:
        - $ref: "#/components/schemas/ApiNotificationEvent"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ConnectivityChangeEventData"

    EventConnectivityImproved:
      description: The predicted connectivity for a subscribed segment and layer moved to a better category.
      allOf:
        - $ref: "#/components/schemas/ApiNotificationEvent"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ConnectivityChangeEventData"

    EventPredictionExpired:
      description: The time interval the last known prediction covered has passed without a superseding prediction.
      allOf:
        - $ref: "#/components/schemas/ApiNotificationEvent"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ConnectivityChangeEventData"

    ConnectivityChangeEventData:
      description: Detail payload shared by the three Predictive Connectivity Data Subscriptions event types.
      type: object
      required:
        - subscriptionId
        - segmentId
      properties:
        subscriptionId:
          $ref: "../common/CAMARA_event_common.yaml#/components/schemas/SubscriptionId"
        segmentId:
          type: string
          maxLength: 16
          description: The route segment the event relates to, in the same `seg-{startWaypointIndex}-{endWaypointIndex}` form returned by the base retrieve operation.
        layerIndex:
          type: integer
          format: int32
          minimum: 0
          maximum: 99
          description: Index of the vertical layer the reported connectivity value applies to.
        connectivity:
          $ref: "predictive-connectivity-data.yaml#/components/schemas/Connectivity"
        startTime:
          description: Start of the time interval the reported connectivity value applies to.
          allOf:
            - $ref: "../common/CAMARA_common.yaml#/components/schemas/DateTime"
        endTime:
          description: End of the time interval the reported connectivity value applies to.
          allOf:
            - $ref: "../common/CAMARA_common.yaml#/components/schemas/DateTime"

    EventSubscriptionStarted:
      description: Event structure for subscription started event.
      allOf:
        - $ref: "#/components/schemas/SubscriptionLifecycleEvent"
        - type: object
          properties:
            data:
              $ref: "../common/CAMARA_event_common.yaml#/components/schemas/SubscriptionStarted"

    EventSubscriptionUpdated:
      description: Event structure for subscription updated event.
      allOf:
        - $ref: "#/components/schemas/SubscriptionLifecycleEvent"
        - type: object
          properties:
            data:
              $ref: "../common/CAMARA_event_common.yaml#/components/schemas/SubscriptionUpdated"

    EventSubscriptionEnded:
      description: Event structure for subscription ended event.
      allOf:
        - $ref: "#/components/schemas/SubscriptionLifecycleEvent"
        - type: object
          properties:
            data:
              $ref: "../common/CAMARA_event_common.yaml#/components/schemas/SubscriptionEnded"

    HTTPSubscriptionRequest:
      description: Subscription request for HTTP-based event delivery.
      allOf:
        - $ref: "#/components/schemas/SubscriptionRequest"
        - type: object
          properties:
            protocolSettings:
              $ref: "../common/CAMARA_event_common.yaml#/components/schemas/HTTPSettings"

    HTTPSubscriptionResponse:
      description: Subscription resource returned for HTTP-based event delivery.
      allOf:
        - $ref: "#/components/schemas/Subscription"
        - type: object
          properties:
            protocolSettings:
              $ref: "../common/CAMARA_event_common.yaml#/components/schemas/HTTPSettings"
  examples:
    SubscriptionRequestExample:
      summary: Subscribe to connectivity changes for two segments of a route
