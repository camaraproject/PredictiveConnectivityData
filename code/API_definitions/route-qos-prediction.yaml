openapi: 3.0.3
info:
  title: Route QoS Prediction
  description: |
    The Route QoS Prediction API provides trajectory-aware, per-segment forecasts of network quality along a planned route, before a device travels it. It is a scope enhancement of Predictive Connectivity Data: it reuses that API's prediction model but accepts a route (an ordered list of waypoints) instead of an area, and returns a forecast broken down per route segment in travel order instead of per grid cell.

    # Introduction

    An application submits a planned route and receives a forecast of network conditions (latency, throughput, and the reliability of any declared QoS requirements) with a confidence value for each segment of that route. Typical use cases include an ambulance dispatcher checking which segments of a route have weak connectivity before departure, a fleet operator comparing two candidate routes by their expected QoS, or a drone operator validating that a planned flight corridor has sufficient coverage before authorizing it.

    This API only produces the forecast. Route optimisation or selection, invoking Quality on Demand, and any application-level adaptation to the forecast are outside its scope; they are useful examples of how an application might compose this capability with other CAMARA APIs, not part of this API itself.

    # Relevant Terms and Definitions

    **Route**
    A planned route expressed as an ordered list of waypoints, from 2 up to 50. Granularity is controlled entirely by how densely the application places its waypoints; the API does not resample or interpolate the submitted route.

    **Segment**
    The portion of the route between two consecutive waypoints. The forecast returns one entry per segment, in travel order, each referencing the `startWaypointIndex` and `endWaypointIndex` of the originally submitted route.

    **QoS Requirement**
    A metric (`LATENCY`, `THROUGHPUT`, or `RELIABILITY`) together with a target value the caller wants assessed along the route. For each requirement, each segment's forecast includes a `reliabilityScore`: the predicted probability that the target is met across that segment.

    **Outcome Status**
    Every segment carries a mandatory `outcome.status`. When it is not `AVAILABLE` (for example `INSUFFICIENT_DATA`, `OUT_OF_COVERAGE`, `NOT_SUPPORTED`, or `UNAVAILABLE`), all metric fields for that segment are `null` rather than omitted or silently defaulted, so the application can handle the gap explicitly.

    **Confidence**
    `confidenceLevel` is a best-effort, implementation-specific probability (0.0-1.0) that a segment's own prediction is correct; it is not guaranteed to be comparable across operators. `confidenceBand` (`LOW`/`MEDIUM`/`HIGH`) is a coarser, more portable indicator for cross-operator comparison.

    All QoS metric values returned by this API are best-effort predictive estimations. They are non-binding and MUST NOT be interpreted as a service-level guarantee.

    # API Functionality

    The API exposes a single `POST /retrieve` operation. The API consumer submits a route, the QoS requirements to assess, and optionally a device identifier (the MVP is device-independent: if a 3-legged access token is used, the device is derived from the token and the `device` object is omitted) and a `predictionHorizon` bounding how far ahead the forecast should look.

    The response is a stateless, synchronous forecast: nothing is stored server-side and no resource identifier is returned. It is not a subscription to future forecast changes; ongoing forecast-change notifications are handled by the companion Route QoS Prediction Subscriptions API.

    How an operator computes the forecast (for example, interpolating from an area-level model such as Predictive Connectivity Data's own, or using a native per-segment model) is an implementation detail left to the provider. The `confidenceLevel` and `confidenceBand` fields give the application a direct signal of prediction quality regardless of the underlying approach.

    # Informative Annex: Reference Architecture

    The diagram below illustrates one possible way an application might compose this API with others; it is informative only and not part of the normative API contract.

    ![Route QoS Prediction Reference Architecture](https://raw.githubusercontent.com/camaraproject/PredictiveConnectivityData/main/documentation/SupportingDocuments/route-qos-prediction-reference-architecture.png)

    An ambulance dispatcher application submits a planned route (1) and receives a per-segment forecast (2). The application identifies segments where `reliabilityScore` falls below an acceptable threshold (3) and, outside the scope of this API, invokes Quality on Demand to pre-establish a prioritized session on those segments (4) before the ambulance departs (5). How the operator network realises the forecast internally is implementation-specific and shown here only as a black box.

    <!-- CAMARA:MANDATORY:authorization-and-authentication:BEGIN -->

    # Authorization and authentication

    The "Camara Security and Interoperability Profile" provides details of how an API consumer requests an access token. Please refer to Identity and Consent Management (https://github.com/camaraproject/IdentityAndConsentManagement/) for the released version of the profile.

    The specific authorization flows to be used will be agreed upon during the onboarding process, happening between the API consumer and the API provider, taking into account the declared purpose for accessing the API, whilst also being subject to the prevailing legal framework dictated by local legislation.

    In cases where personal data is processed by the API and users can exercise their rights through mechanisms such as opt-in and/or opt-out, the use of three-legged access tokens is mandatory. This ensures that the API remains in compliance with privacy regulations, upholding the principles of transparency and user-centric privacy-by-design.
    <!-- CAMARA:MANDATORY:authorization-and-authentication:END -->

    <!-- CAMARA:MANDATORY:additional-error-responses:BEGIN -->

    # Additional CAMARA error responses

    The list of error codes in this API specification is not exhaustive. Therefore the API specification MAY not document some non-mandatory error statuses as indicated in `CAMARA API Design Guide`.

    Please refer to the `CAMARA_common.yaml` of the Commonalities Release associated to this API version for a complete list of error responses. The applicable Commonalities Release can be identified from the `x-camara-commonalities` field, the changelog and the metadata of the released API version.

    As a specific rule, error `501 - NOT_IMPLEMENTED` can be only a possible error response if it is explicitly documented in the API.
    <!-- CAMARA:MANDATORY:additional-error-responses:END -->

    <!-- CAMARA:MANDATORY:request-body-strictness:BEGIN -->

    # Request body strictness

    This API rejects requests with JSON request bodies that contain properties not declared in this specification, at any nesting level. Unknown properties result in a `400 INVALID_ARGUMENT` response.
    <!-- CAMARA:MANDATORY:request-body-strictness:END -->
