  version: wip
  x-camara-commonalities: 0.9.0
externalDocs:
  description: Product documentation at CAMARA
  url: https://github.com/camaraproject/PredictiveConnectivityData
servers:
  - url: "{apiRoot}/route-qos-prediction/vwip"
    variables:
      apiRoot:
        default: http://localhost:9091
        description: API root, defined by the service provider, e.g. `api.example.com` or `api.example.com/somepath`
tags:
  - name: Route QoS Prediction
    description: Retrieve a per-segment QoS forecast for a planned route.
paths:
  /retrieve:
    post:
      tags:
        - Route QoS Prediction
      summary: Retrieve a route QoS forecast
      description: >-
        Submit a planned route and receive a per-segment QoS forecast.
        This is a stateless retrieval: nothing is stored server-side and no
        resource identifier is returned. It is not a subscription to future
        forecast changes; see the companion Route QoS Prediction Subscriptions API.
      operationId: retrieveRouteQosForecast
      security:
        - openId:
            - route-qos-prediction:read
      parameters:
        - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetrieveRouteQosRequest"
            examples:
              RetrieveRouteQosRequestExample:
                $ref: "#/components/examples/RetrieveRouteQosRequestExample"
      responses:
        "200":
          description: Forecast returned
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteQosForecast"
              examples:
                RouteQosForecastExample:
                  $ref: "#/components/examples/RouteQosForecastExample"
        "400":
          $ref: "../common/CAMARA_common.yaml#/components/responses/BadRequestWithRange400"
        "401":
          $ref: "../common/CAMARA_common.yaml#/components/responses/Unauthenticated401"
        "403":
          $ref: "../common/CAMARA_common.yaml#/components/responses/PermissionDenied403"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType415"
        "422":
          $ref: "../common/CAMARA_common.yaml#/components/responses/DeviceIdentifier422"
        "429":
          $ref: "../common/CAMARA_common.yaml#/components/responses/TooManyRequests429"
components:
  securitySchemes:
    openId:
      $ref: "../common/CAMARA_common.yaml#/components/securitySchemes/openId"
  responses:
    UnsupportedMediaType415:
      description: Unsupported Media Type
      headers:
        x-correlator:
          $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "../common/CAMARA_common.yaml#/components/schemas/ErrorInfo"
              - type: object
                properties:
                  status:
                    enum:
                      - 415
                  code:
                    enum:
                      - UNSUPPORTED_MEDIA_TYPE
          examples:
            GENERIC_415_UNSUPPORTED_MEDIA_TYPE:
              value:
                status: 415
                code: UNSUPPORTED_MEDIA_TYPE
                message: The server refuses to accept the request because the payload format is in an unsupported format.
  schemas:
    RetrieveRouteQosRequest:
      description: Request for a route QoS forecast for a planned route.
      type: object
      additionalProperties: false
      required:
        - route
        - qosRequirements
      properties:
        device:
          $ref: "../common/CAMARA_common.yaml#/components/schemas/Device"
        route:
          $ref: "#/components/schemas/Route"
        qosRequirements:
          type: array
          minItems: 1
          description: |
            The QoS requirements the caller wants forecast for each segment. Each
            requirement declares a metric and the target value to assess against;
            `reliabilityScore` is then the probability that target is met.
          items:
            $ref: "#/components/schemas/QosRequirement"
        predictionHorizon:
          type: string
          format: date-time
          description: |
            Upper time bound of interest. The forecast targets the period during
            which the device is expected to traverse the route, up to this time.

    Route:
      type: object
      description: A planned route expressed as an ordered list of waypoints.
      required:
        - waypoints
      properties:
        waypoints:
          type: array
          minItems: 2
          maxItems: 50
          description: |
            Ordered geographic waypoints describing the route/corridor. Native
            route input, rather than a polygon or area, is the delta this API
            adds on top of Predictive Connectivity Data.
          items:
            $ref: "../common/CAMARA_common.yaml#/components/schemas/Point"

    QosMetricName:
      type: string
      description: Name of a forecastable QoS metric.
      enum:
        - LATENCY
        - THROUGHPUT
        - RELIABILITY

    QosRequirement:
      description: |
        A QoS requirement to assess along the route: a metric plus the target value
        the caller needs. The target is interpreted per metric:
        `LATENCY` is an upper bound in milliseconds; `THROUGHPUT` is a lower bound in
        Mbps; `RELIABILITY` is a lower bound on a 0.0-1.0 scale.
      type: object
      required:
        - metric
        - targetValue
      properties:
        metric:
          $ref: "#/components/schemas/QosMetricName"
        targetValue:
          type: number
          format: float
          minimum: 0
          description: The target value for the metric, interpreted per the metric definition.

    RouteQosForecast:
      description: A per-segment QoS forecast for the submitted route. Stateless; not stored server-side.
      type: object
      required:
        - segments
      properties:
        generatedAt:
          type: string
          format: date-time
          description: Time at which the forecast was generated.
        validUntil:
          type: string
          format: date-time
          description: Time after which the forecast should be considered stale and re-requested.
        segments:
          type: array
          description: Per-segment forecast, in route order.
          items:
            $ref: "#/components/schemas/RouteSegment"

    RouteSegment:
      description: The forecast for a single segment of the submitted route.
      type: object
      required:
        - segmentId
        - outcome
      properties:
        segmentId:
          type: string
          example: "seg-007"
          description: Identifier of the route segment.
        startWaypointIndex:
          type: integer
          description: Index into the request route waypoints where the segment starts.
        endWaypointIndex:
          type: integer
          description: Index into the request route waypoints where the segment ends.
        outcome:
          $ref: "#/components/schemas/SegmentOutcome"
        latencyMs:
          type: number
          format: float
          nullable: true
          minimum: 0
          description: |
            Best-effort predicted one-way latency in milliseconds.
            `null` when `outcome.status` is not `AVAILABLE`.
        throughputMbps:
          type: number
          format: float
          nullable: true
          minimum: 0
          description: |
            Best-effort predicted throughput in Mbps.
            `null` when `outcome.status` is not `AVAILABLE`.
        requirementForecasts:
          type: array
          nullable: true
          description: |
            One entry per requested `qosRequirement`, giving the reliability of that
            requirement on this segment. `null` when `outcome.status` is not `AVAILABLE`.
          items:
            $ref: "#/components/schemas/RequirementForecast"
        confidenceLevel:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 1
          description: |
            Best-effort calibrated probability (0.0-1.0) that the model's own
            prediction for this segment is correct. Degrades with sparse/stale
            data. Absolute cross-operator equivalence is NOT guaranteed; see
            `confidenceBand` for a portable, coarser indicator. `null` when
            `outcome.status` is not `AVAILABLE`.
        confidenceBand:
          $ref: "#/components/schemas/ConfidenceBand"

    RequirementForecast:
      description: The reliability of one requested QoS requirement on a segment.
      type: object
      required:
        - metric
        - reliabilityScore
      properties:
        metric:
          $ref: "#/components/schemas/QosMetricName"
        reliabilityScore:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: |
            Best-effort probability (0.0-1.0) that this requirement's `targetValue`
            is met across this segment for the duration of traversal.

    SegmentOutcome:
      type: object
      description: |
        Mandatory enum-based outcome for the segment. Always present, including
        for successful predictions.
      required:
        - status
      properties:
        status:
          $ref: "#/components/schemas/OutcomeStatus"
        reason:
          type: string
          description: Human-readable explanation, primarily for non-AVAILABLE statuses.

    OutcomeStatus:
      type: string
      description: |
        * `AVAILABLE` - a prediction was computed; metric fields populated.
        * `INSUFFICIENT_DATA` - not enough / too-stale data to predict at
          acceptable confidence; metric fields `null`.
        * `OUT_OF_COVERAGE` - segment outside served coverage; no service
          expected; metric fields `null`.
        * `NOT_SUPPORTED` - a requested metric is not supported for this
          segment/area; metric fields `null`.
        * `UNAVAILABLE` - prediction could not be produced (internal/transient);
          metric fields `null`.
      enum:
        - AVAILABLE
        - INSUFFICIENT_DATA
        - OUT_OF_COVERAGE
        - NOT_SUPPORTED
        - UNAVAILABLE

    ConfidenceBand:
      type: string
      description: |
        Coarse, cross-operator-portable confidence indicator. Provided as a more
        comparable alternative to the numeric `confidenceLevel`.
      enum:
        - LOW
        - MEDIUM
        - HIGH
  examples:
    RetrieveRouteQosRequestExample:
      summary: Ambulance dispatch route with latency and reliability requirements
      value:
        route:
          waypoints:
            - latitude: 50.735851
              longitude: 7.10066
            - latitude: 50.74
              longitude: 7.11
            - latitude: 50.73
              longitude: 7.12
        qosRequirements:
          - metric: LATENCY
            targetValue: 100
          - metric: RELIABILITY
            targetValue: 0.95
        predictionHorizon: "2024-01-03T12:00:00Z"
    RouteQosForecastExample:
      summary: Forecast with one degraded segment
      value:
        generatedAt: "2024-01-03T11:00:00Z"
        validUntil: "2024-01-03T12:00:00Z"
        segments:
          - segmentId: "seg-001"
            startWaypointIndex: 0
            endWaypointIndex: 1
            outcome:
              status: AVAILABLE
            latencyMs: 45.2
            throughputMbps: 120.5
            requirementForecasts:
              - metric: LATENCY
                reliabilityScore: 0.97
              - metric: RELIABILITY
                reliabilityScore: 0.96
            confidenceLevel: 0.9
            confidenceBand: HIGH
          - segmentId: "seg-002"
            startWaypointIndex: 1
            endWaypointIndex: 2
            outcome:
              status: AVAILABLE
            latencyMs: 180.0
            throughputMbps: 12.0
            requirementForecasts:
              - metric: LATENCY
                reliabilityScore: 0.4
              - metric: RELIABILITY
                reliabilityScore: 0.6
            confidenceLevel: 0.55
            confidenceBand: MEDIUM
